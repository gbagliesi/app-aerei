# Pubblica il Worker Cloudflare (tabelloni-voli). Si avvia solo a mano (Actions → Deploy Worker → Run workflow),
# mai da un push. Servono i segreti del repo CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name: Deploy Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # toglie spazi, a capo e un eventuale "Bearer" incollati per errore; il token non viene mai stampato
          T=$(printf %s "$RAW_TOKEN" | tr -d '[:space:]'); T=${T#Bearer}
          echo "::add-mask::$T"
          echo "token: ${#T} caratteri, di cui non alfanumerici: $(printf %s "$T" | tr -d 'A-Za-z0-9_-' | wc -c)"
          CLOUDFLARE_API_TOKEN="$T" npx -y wrangler@4 deploy --config worker/wrangler.toml --keep-vars
      - name: Verifica
        run: |
          for a in MXP AMS ZRH; do
            curl -s -w " -> $a %{http_code} %{time_total}s\n" "https://tabelloni-voli.giuseppe-bagliesi.workers.dev/board?airport=$a&nature=D" | tail -c 300
          done
          echo "== FlightAware"; curl -s -w " -> /fa/usage %{http_code}\n" "https://tabelloni-voli.giuseppe-bagliesi.workers.dev/fa/usage"
          curl -s -w " -> /fa %{http_code}\n" "https://tabelloni-voli.giuseppe-bagliesi.workers.dev/fa?ident=AZ1&date=$(date -u +%F)" | head -c 600; echo
          echo "== notifiche"; curl -s -w " -> /push/key %{http_code}\n" "https://tabelloni-voli.giuseppe-bagliesi.workers.dev/push/key" | head -c 200
          for a in MXP HKG; do
            echo "== $a"; curl -s "https://tabelloni-voli.giuseppe-bagliesi.workers.dev/debug?airport=$a&nature=D" | grep -o '"count":[0-9]*\|"log":.*' | head -c 1200; echo
          done
