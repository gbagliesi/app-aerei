# Pubblica il Worker Cloudflare (tabelloni-voli). Si avvia solo a mano (Actions → Deploy Worker → Run workflow),
# mai da un push. Servono i segreti del repo CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name: Deploy Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # toglie spazi, a capo e un eventuale "Bearer" incollati per errore; il token non viene mai stampato
          T=$(printf %s "$RAW_TOKEN" | tr -d '[:space:]'); T=${T#Bearer}
          echo "::add-mask::$T"
          echo "token: ${#T} caratteri, di cui non alfanumerici: $(printf %s "$T" | tr -d 'A-Za-z0-9_-' | wc -c)"
          CLOUDFLARE_API_TOKEN="$T" npx -y wrangler@4 deploy worker/worker.js --name tabelloni-voli --compatibility-date 2024-09-23 --keep-vars
      - name: Verifica
        run: |
          for a in MXP AMS ZRH; do
            curl -s -o /dev/null -w "$a %{http_code}\n" "https://tabelloni-voli.giuseppe-bagliesi.workers.dev/board?airport=$a&nature=D"
          done
