# Controllo (solo avvio manuale): chiede al Worker il tabellone di partenze e arrivi degli aeroporti indicati.
name: Check airports

on:
  workflow_dispatch:
    inputs:
      airports:
        description: 'Codici IATA separati da spazio'
        required: true
        default: 'TFS TFN LPA ACE FUE VLC MAN HAM BER ARN VIE PRG DUB EDI CGN BUD SKG CHQ WAW KRK LCA PFO MLA ZAG DBV SXB'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          AIRPORTS: ${{ inputs.airports }}
        run: |
          W=https://tabelloni-voli.giuseppe-bagliesi.workers.dev
          for a in $AIRPORTS; do for n in D A; do
            r=$(curl -s -m 40 -w ' HTTP%{http_code} %{time_total}s' "$W/board?airport=$a&nature=$n")
            c=$(printf %s "$r" | grep -o '"count":[0-9]*' | head -1)
            e=$(printf %s "$r" | grep -o '"error":"[^"]*"' | head -1)
            echo "$a $n ${c:-count:-} ${e} $(printf %s "$r" | grep -o 'HTTP[0-9]* [0-9.]*s$')"
            if [ -n "$e" ]; then curl -s -m 40 "$W/debug?airport=$a&nature=$n" | head -c 700; echo; fi
          done; done
