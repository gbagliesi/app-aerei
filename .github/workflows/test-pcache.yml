# Test della cache persistente dell'app (js/pcache.js) a ogni push e pull request che la toccano.
name: Test cache app

on:
  push:
    paths: ['js/pcache.js', 'js/api.js', 'tools/test-pcache.mjs', '.github/workflows/test-pcache.yml']
  pull_request:
    paths: ['js/pcache.js', 'js/api.js', 'tools/test-pcache.mjs', '.github/workflows/test-pcache.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save --no-package-lock fake-indexeddb
      - run: node tools/test-pcache.mjs
      - run: node tools/case-chain.mjs
