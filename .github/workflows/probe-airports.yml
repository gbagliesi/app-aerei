# Prova diagnostica (solo avvio manuale): una richiesta normale dal Worker ai siti degli aeroporti non supportati.
name: Probe airports

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          T=$(TZ=Europe/Rome date +%H:%M)
          for u in \
            "https://www.veniceairport.it/" \
            "https://www.airport.genova.it/" \
            "https://www.geasar.it/wp-json/olbia-airport/v1/flights/search?limit=0&type=operative&from_time=$T" \
            "https://www.aeroportodialghero.it/wp-json/alghero-airport/v1/flights/search?limit=0&type=operative&from_time=$T" \
            "https://www.milanbergamoairport.it/it/voli-tempo-reale/" \
            "https://www.aeroportodinapoli.it/partenze" ; do
            echo "=== $u"
            curl -s -G "https://tabelloni-voli.giuseppe-bagliesi.workers.dev/probe" --data-urlencode "url=$u" | cut -c1-900
            echo
          done
