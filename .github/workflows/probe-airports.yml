# Prova diagnostica (solo avvio manuale): una richiesta normale dal Worker ai siti degli aeroporti non supportati.
# Ogni riga di PROBES: URL|regex facoltativa da cercare nella risposta.
name: Probe airports

on:
  workflow_dispatch:
    inputs:
      probes:
        description: 'URL|regex separati da spazio'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          PROBES: ${{ inputs.probes }}
        run: |
          [ -n "$PROBES" ] || PROBES="https://www.veneziaairport.it/it_it/|[\"'][^\"']*(volo|voli|flight|partenz|arriv|departure)[^\"']*[\"'] https://www.airport.genova.it/|[\"'][^\"']*(volo|voli|flight|partenz|arriv|wp-json)[^\"']*[\"']"
          for p in $PROBES; do
            # formato: URL|regex|corpo POST|content-type (gli ultimi tre facoltativi)
            IFS='|' read -r u g b c <<< "$p"
            echo "=== $u ${b:+(POST)}"
            curl -s -G "https://tabelloni-voli.giuseppe-bagliesi.workers.dev/probe" --data-urlencode "url=$u" --data-urlencode "grep=$g" ${b:+--data-urlencode "body=$b"} ${c:+--data-urlencode "ctype=$c"} | head -c 6000
            echo
          done
