# Prova diagnostica (solo avvio manuale): una richiesta normale dal Worker ai siti degli aeroporti non supportati.
# Ogni riga di PROBES: URL|regex facoltativa da cercare nella risposta.
name: Probe airports

on:
  workflow_dispatch:
    inputs:
      probes:
        description: 'URL|regex separati da spazio'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          PROBES: ${{ inputs.probes }}
        run: |
          [ -n "$PROBES" ] || PROBES="https://www.veneziaairport.it/it_it/|[\"'][^\"']*(volo|voli|flight|partenz|arriv|departure)[^\"']*[\"'] https://www.airport.genova.it/|[\"'][^\"']*(volo|voli|flight|partenz|arriv|wp-json)[^\"']*[\"']"
          for p in $PROBES; do
            # formato: URL|regex|corpo POST|content-type|profilo header (browser, curl, xhr; tutti facoltativi)
            IFS='|' read -r u g b c h <<< "$p"
            echo "=== $u ${b:+(POST)}"
            curl -s -G "https://tabelloni-voli.giuseppe-bagliesi.workers.dev/probe" --data-urlencode "url=$u" --data-urlencode "grep=$g" ${b:+--data-urlencode "body=$b"} ${c:+--data-urlencode "ctype=$c"} ${h:+--data-urlencode "hp=$h"} > r.json; if [ -n "$g" ]; then jq -c 'del(.start) | select((.matches // []) | length > 0 or .status != 200)' r.json 2>/dev/null || head -c 3000 r.json; else head -c 6000 r.json; fi
            echo
          done
