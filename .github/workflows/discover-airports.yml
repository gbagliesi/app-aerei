# Ricerca fonti ufficiali (solo avvio manuale): richieste normali dal runner di GitHub
# alle pagine pubbliche degli aeroporti in tools/discover.json; elenca gli URL di API trovati.
name: Discover airports

on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'Codici IATA separati da spazio (vuoto = tutti)'
        required: false
        default: ''

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Discover
        run: python3 tools/discover.py tools/discover.json ${{ inputs.codes }}
